<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Papirus-style tile: solid colour, soft bottom shadow, light top sheen. -->
  <rect x="4" y="5.5" width="56" height="56" rx="13" fill="#000000" opacity=".22"/>
  <rect x="4" y="4" width="56" height="56" rx="13" fill="#4a90e2"/>
  <rect x="4" y="4" width="56" height="56" rx="13" fill="url(#sheen)"/>

  <!-- Rewind ring with a 60-degree gap at the top. -->
  <path d="M40.25 17.71 A16.5 16.5 0 1 1 23.75 17.71"
        fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M40.25 12.6 L40.25 22.8 L33.6 17.7 Z" fill="#ffffff"/>

  <!-- Clock hands. -->
  <path d="M32 32 V22" fill="none" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M32 32 L40 36" fill="none" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="3.2" fill="#ffffff"/>
</svg>
