<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3d4f6d"/>
      <stop offset="1" stop-color="#141a24"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe3ff"/>
      <stop offset="1" stop-color="#3f8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#8fe3ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8fe3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)"/>
  <circle cx="64" cy="62" r="52" fill="url(#glow)"/>

  <!-- Rewind ring: 300 degrees, gap at the top where the arrow head points. -->
  <path d="M 83.3 41.0 A 30 30 0 1 1 53.7 35.8"
        fill="none" stroke="url(#ring)" stroke-width="9" stroke-linecap="round"/>
  <!-- Arrow head at the arc end (angle 250 deg), tangential: rotate(-20). -->
  <path d="M 0 0 L -16 -8.5 L -16 8.5 Z" fill="#8fe3ff"
        transform="translate(69 32.5) rotate(-20)"/>

  <!-- Clock hands -->
  <path d="M 64 64 L 64 45" fill="none" stroke="#f2f7ff" stroke-width="7" stroke-linecap="round"/>
  <path d="M 64 64 L 78 71" fill="none" stroke="#c9d8ee" stroke-width="7" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="5" fill="#f2f7ff"/>
</svg>
