[package]
name = "kustos"
version = "0.2.0"
edition = "2021"
description = "Time Machine-style encrypted snapshots of a home folder"
license = "GPL-3.0-or-later"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[[bin]]
name = "kustos"
path = "rust/main.rs"

[dependencies]
qmetaobject = "0.2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
